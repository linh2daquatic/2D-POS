<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khách hàng — 2D Aquatic POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(10,22,40,0.5); z-index:100; align-items:center; justify-content:center; padding:20px; }
.modal-overlay.open { display:flex; }
.modal-box { background:#fff; border-radius:14px; width:100%; max-width:460px; max-height:88vh; overflow-y:auto; }
.modal-box.wide { max-width:560px; }
.modal-box.xwide { max-width:min(1000px,96vw); }
.modal-box { overflow-x:hidden; }
.table-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
.summary-row { display:flex; justify-content:space-between; padding:5px 0; font-size:13.5px; }
.summary-row.total { font-weight:700; font-size:15.5px; border-top:1px solid var(--border); margin-top:6px; padding-top:10px; }
.order-row-clickable { cursor:pointer; }
.order-row-clickable:hover { background:#f8fafc; }
.modal-header { padding:18px 22px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
.modal-header h3 { font-family:var(--font-display); font-size:18px; }
.modal-body { padding:20px 22px; }
.modal-close { cursor:pointer; font-size:20px; color:var(--text-mute); }
.row-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.search-bar { max-width:320px; margin-bottom:0; }
.btn-mini { padding:5px 10px; font-size:12px; }
.row-actions { display:flex; gap:6px; }
.type-toggle { display:flex; gap:6px; }
.type-btn { flex:1; padding:9px; text-align:center; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-weight:600; font-size:13px; color:var(--text-mute); background:#fff; }
.type-btn.active.retail { border-color:var(--teal-deep); color:var(--teal-deep); background:#ecfdf5; }
.type-btn.active.wholesale { border-color:#4338ca; color:#4338ca; background:#eef2ff; }
.sort-chips { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
.sort-chip { padding:6px 14px; border-radius:20px; font-size:12.5px; border:1px solid var(--border); cursor:pointer; background:#fff; color:var(--text-mute); }
.sort-chip.active { background:var(--ink); color:#fff; border-color:var(--ink); }
.no-purchase { color:var(--text-mute); font-style:italic; }
.vip-tag { font-size:11px; background:#fff7ed; color:#c2410c; padding:2px 8px; border-radius:10px; margin-left:6px; font-weight:600; }
.tabs-row { display:flex; gap:8px; margin-bottom:16px; border-bottom:1px solid var(--border); }
.settings-link { color:var(--teal-deep); text-decoration:underline; font-weight:600; }
@media (max-width: 860px) { .tank-buyer-cols { grid-template-columns:1fr !important; } }
.tab-btn { padding:10px 4px; margin-right:16px; font-size:14px; font-weight:600; color:var(--text-mute); cursor:pointer; border-bottom:2px solid transparent; }
.tab-btn.active { color:var(--ink); border-bottom-color:var(--teal-deep); }
.pay-method-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.debt-card { border:1px solid var(--border); border-radius:10px; margin-bottom:10px; overflow:hidden; }
.debt-card-head { padding:14px 16px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; background:#fff; flex-wrap:wrap; gap:10px; }
.debt-card-head:hover { background:#f8fafc; }
.debt-card-name { font-weight:600; font-size:14.5px; }
.debt-card-sub { font-size:12px; color:var(--text-mute); margin-top:2px; }
.debt-card-amount { font-family:var(--font-display); font-weight:700; font-size:17px; color:var(--danger); }
.debt-card-body { display:none; border-top:1px solid var(--border); padding:12px 16px; background:#fbfcfd; }
.debt-card-body.open { display:block; }
.debt-order-row { display:flex; justify-content:space-between; padding:7px 0; font-size:13px; border-bottom:1px dashed var(--border); }
.debt-order-row:last-child { border-bottom:none; }
</style>
</head>
<body>

<script src="js/supabase-client.js"></script>
<script src="js/layout.js"></script>
<script>
let CURRENT_PROFILE = null;
let ALL_CUSTOMERS = [];
let TANK_BUYERS_LOADED = false;
let ALL_TANK_BUYERS = [];
let CUSTOMER_STATS = {};
let EDIT_ID = null;
let FORM_TYPE = "retail";
let SORT_MODE = "name";
let DEBT_LIST = [];
let PAY_CUSTOMER = null;
let CARE_CYCLE = 30;
let CARE_FILTER = "due";
let CARE_DATA = { orders: [], contacts: [] };
let CARE_ROWS = [];

(async () => {
  const auth = await requireAuth();
  if (!auth) return;
  CURRENT_PROFILE = auth.profile;

  renderLayout({
    activePage: "customers",
    profile: CURRENT_PROFILE,
    title: "Khách hàng",
    subtitle: "Danh sách khách hàng và công nợ"
  });

  document.getElementById("pageContent").innerHTML = `
    <div class="tabs-row">
      <div class="tab-btn active" data-tab="customers">Khách hàng</div>
      <div class="tab-btn" data-tab="debt">Công nợ khách hàng</div>
      <div class="tab-btn" data-tab="tankBuyers">🐠 Khách mua bể ProMax/Infinity</div>
      <div class="tab-btn" data-tab="care">💬 Chăm sóc khách</div>
    </div>

    <div id="customersTab">
      <div class="flex" style="justify-content:space-between; margin-bottom:16px;">
        <input class="search-bar" id="searchInput" placeholder="🔍 Tìm theo tên hoặc số điện thoại...">
        <button class="btn btn-secondary" id="dupBtn" style="display:none;" title="Gộp các khách trùng số điện thoại">🔀 Gộp khách trùng <span id="dupCount"></span></button>
        <button class="btn btn-primary" id="addBtn">+ Thêm khách hàng</button>
      </div>
      <div class="sort-chips" id="sortChips">
        <div class="sort-chip active" data-sort="name">Tên A-Z</div>
        <div class="sort-chip" data-sort="spend">Chi tiêu cao nhất</div>
        <div class="sort-chip" data-sort="recent">Mua gần đây nhất</div>
      </div>
      <div class="panel">
        <div class="panel-body" id="tableWrap">
          <div class="empty-state"><div class="icon">⏳</div>Đang tải...</div>
        </div>
      </div>
    </div>

    <div id="careTab" style="display:none;">
      <div class="flex gap-8" style="flex-wrap:wrap; align-items:center; margin-bottom:12px;">
        <input class="search-bar" id="careSearchInput" placeholder="🔍 Tìm theo tên hoặc SĐT..." style="max-width:280px; margin-bottom:0;">
        <select id="careCycleSelect" style="max-width:210px;">
          <option value="14">Chu kỳ nhắn: 14 ngày</option>
          <option value="21">Chu kỳ nhắn: 21 ngày</option>
          <option value="30">Chu kỳ nhắn: 30 ngày</option>
          <option value="45">Chu kỳ nhắn: 45 ngày</option>
          <option value="60">Chu kỳ nhắn: 60 ngày</option>
          <option value="90">Chu kỳ nhắn: 90 ngày</option>
        </select>
        <span class="btn btn-secondary btn-mini" id="careEditTplBtn" style="display:none;">✎ Sửa mẫu tin nhắn</span>
      </div>
      <div class="sort-chips" id="careChips">
        <div class="sort-chip active" data-carefilter="due">Cần nhắn hôm nay</div>
        <div class="sort-chip" data-carefilter="all">Tất cả khách</div>
        <div class="sort-chip" data-carefilter="recent">Đã nhắn 7 ngày qua</div>
      </div>
      <div class="text-mute" id="careSummary" style="font-size:12.5px; margin-bottom:10px;"></div>
      <div id="careListWrap"><div class="empty-state"><div class="icon">⏳</div>Đang tải...</div></div>
    </div>

    <div id="debtTab" style="display:none;">
      <div class="stat-grid" id="statGrid"></div>
      <input class="search-bar" id="debtSearchInput" placeholder="🔍 Tìm khách hàng..." style="margin-bottom:16px;">
      <div id="debtListWrap"><div class="empty-state"><div class="icon">⏳</div>Đang tải...</div></div>
    </div>

      <div class="subtabs-row" style="display:flex; gap:20px; border-bottom:1px solid var(--border); margin-bottom:16px;">
        <div class="subtab-btn active" data-tankgroup="promax" style="padding:8px 2px; font-size:14px; font-weight:600; color:var(--ink); cursor:pointer; border-bottom:2px solid var(--teal-deep);">🔵 2D ProMax</div>
        <div class="subtab-btn" data-tankgroup="infinity" style="padding:8px 2px; font-size:14px; font-weight:600; color:var(--text-mute); cursor:pointer; border-bottom:2px solid transparent;">🟢 2D Infinity</div>
      </div>

      <div class="flex gap-8" style="flex-wrap:wrap; align-items:flex-end; margin-bottom:12px;">
        <div class="field" style="margin-bottom:0; max-width:170px;"><label>Từ ngày</label><input id="tb_fromDate" type="date"></div>
        <div class="field" style="margin-bottom:0; max-width:170px;"><label>Đến ngày</label><input id="tb_toDate" type="date"></div>
        <select id="tb_monthPicker" style="max-width:190px;"></select>
        <span class="btn btn-secondary btn-mini" id="tb_applyDateBtn">Lọc</span>
        <span class="btn btn-secondary btn-mini" id="tb_resetDateBtn">Xem tất cả</span>
      </div>

      <input class="search-bar" id="tankBuyersSearchInput" placeholder="🔍 Tìm theo tên khách hoặc SĐT..." style="margin-bottom:16px;">
      <div id="tankBuyersWrap"><div class="empty-state"><div class="icon">⏳</div>Đang tải...</div></div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-box">
        <div class="modal-header">
          <h3 id="modalTitle">Thêm khách hàng</h3>
          <span class="modal-close" id="modalClose">✕</span>
        </div>
        <div class="modal-body">
          <form id="custForm">
            <div class="field"><label>Loại khách hàng</label>
              <div class="type-toggle">
                <div class="type-btn retail active" id="typeRetailBtn">Bán lẻ</div>
                <div class="type-btn wholesale" id="typeWholesaleBtn">Bán buôn</div>
              </div>
            </div>
            <div class="field"><label>Tên khách hàng *</label><input id="f_name" required></div>
            <div class="row-2">
              <div class="field"><label>Số điện thoại</label><input id="f_phone"></div>
              <div class="field"><label>Hạn mức nợ (₫)</label><input id="f_debt_limit" type="number" step="any" value="0"></div>
            </div>
            <div class="field"><label>Địa chỉ</label><input id="f_address"></div>
            <div class="field"><label>🪸 Thông tin bể của khách</label><textarea id="f_tank_info" rows="2" placeholder="VD: Bể 2D ProMax S40, nuôi SPS + cá hề, đèn Maxspect, lọc vách..."></textarea></div>
            <div class="field"><label>Ghi chú</label><textarea id="f_notes" rows="2"></textarea></div>
            <div class="flex gap-8" style="margin-top:16px; justify-content:flex-end;">
              <button type="button" class="btn btn-secondary" id="cancelBtn">Hủy</button>
              <button type="submit" class="btn btn-primary" id="saveBtn">Lưu khách hàng</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="ordersHistoryModal">
      <div class="modal-box xwide">
        <div class="modal-header">
          <h3 id="ordersHistoryTitle">Lịch sử mua hàng</h3>
          <span class="modal-close" id="ordersHistoryClose">✕</span>
        </div>
        <div class="modal-body" id="ordersHistoryBody"></div>
      </div>
    </div>

    <div class="modal-overlay" id="dupModal">
      <div class="modal-box xwide">
        <div class="modal-header">
          <h3>🔀 Gộp khách hàng trùng số điện thoại</h3>
          <span class="modal-close" id="dupClose">✕</span>
        </div>
        <div class="modal-body" id="dupBody"></div>
      </div>
    </div>

    <div class="modal-overlay" id="payModal">
      <div class="modal-box">
        <div class="modal-header">
          <h3 id="payModalTitle">Ghi nhận thanh toán</h3>
          <span class="modal-close" id="payModalClose">✕</span>
        </div>
        <div class="modal-body">
          <div class="summary-row total" style="margin-bottom:14px;">
            <span>Đang nợ</span><span id="payCurrentDebt">0₫</span>
          </div>
          <div class="pay-method-row">
            <div class="field"><label>Tiền mặt</label><input id="pay_cash" type="number" step="any" value="0"></div>
            <div class="field"><label>Chuyển khoản</label><input id="pay_transfer" type="number" step="any" value="0"></div>
          </div>
          <div class="field"><label>Ghi chú</label><input id="pay_note" placeholder="Không bắt buộc"></div>
          <div class="summary-row total"><span>Còn nợ sau khi trả</span><span id="payRemaining">0₫</span></div>
          <div class="flex gap-8" style="margin-top:16px; justify-content:flex-end;">
            <button type="button" class="btn btn-secondary" id="payCancelBtn">Hủy</button>
            <button type="button" class="btn btn-primary" id="paySaveBtn">Ghi nhận</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="careTplModal">
      <div class="modal-box wide">
        <div class="modal-header">
          <h3>Mẫu tin nhắn chăm sóc</h3>
          <span class="modal-close" id="careTplClose">✕</span>
        </div>
        <div class="modal-body" id="careTplBody"></div>
      </div>
    </div>

    <div class="modal-overlay" id="orderDetailModal">
      <div class="modal-box xwide">
        <div class="modal-header">
          <h3 id="orderDetailTitle">Chi tiết đơn hàng</h3>
          <span class="modal-close" id="orderDetailClose">✕</span>
        </div>
        <div class="modal-body" id="orderDetailBody"></div>
      </div>

  `;

  await Promise.all([loadCustomers(), loadDebts()]);

  document.querySelectorAll(".tabs-row .tab-btn").forEach(el => {
    el.addEventListener("click", () => switchMainTab(el.dataset.tab));
  });

  document.getElementById("searchInput").addEventListener("input", (e) => renderTable(e.target.value));
  document.getElementById("addBtn").addEventListener("click", () => openModal());
  document.getElementById("dupBtn").addEventListener("click", openDupModal);
  document.getElementById("dupClose").addEventListener("click", () => document.getElementById("dupModal").classList.remove("open"));
  document.getElementById("modalClose").addEventListener("click", closeModal);
  document.getElementById("cancelBtn").addEventListener("click", closeModal);
  document.getElementById("custForm").addEventListener("submit", saveCustomer);
  document.getElementById("typeRetailBtn").addEventListener("click", () => setFormType("retail"));
  document.getElementById("typeWholesaleBtn").addEventListener("click", () => setFormType("wholesale"));

  document.querySelectorAll("#sortChips .sort-chip").forEach(el => {
    el.addEventListener("click", () => {
      document.querySelectorAll("#sortChips .sort-chip").forEach(x => x.classList.remove("active"));
      el.classList.add("active");
      SORT_MODE = el.dataset.sort;
      renderTable(document.getElementById("searchInput").value);
    });
  });

  document.getElementById("ordersHistoryClose").addEventListener("click", () => document.getElementById("ordersHistoryModal").classList.remove("open"));
  document.getElementById("orderDetailClose").addEventListener("click", () => document.getElementById("orderDetailModal").classList.remove("open"));

  document.getElementById("debtSearchInput").addEventListener("input", (e) => renderDebtList(e.target.value));
  document.getElementById("tankBuyersSearchInput").addEventListener("input", (e) => renderTankBuyers(e.target.value));
  document.querySelectorAll("#tankBuyersTab .subtab-btn").forEach(el => {
    el.addEventListener("click", () => {
      TANK_GROUP_ACTIVE = el.dataset.tankgroup;
      document.querySelectorAll("#tankBuyersTab .subtab-btn").forEach(x => {
        x.classList.toggle("active", x === el);
        x.style.color = x === el ? "var(--ink)" : "var(--text-mute)";
        x.style.borderBottomColor = x === el ? "var(--teal-deep)" : "transparent";
      });
      renderTankBuyers(document.getElementById("tankBuyersSearchInput").value);
    });
  });
  document.getElementById("tb_applyDateBtn").addEventListener("click", () => {
    TANK_FROM_DATE = document.getElementById("tb_fromDate").value || null;
    TANK_TO_DATE = document.getElementById("tb_toDate").value || null;

  document.getElementById("tb_resetDateBtn").addEventListener("click", () => {
    document.getElementById("tb_fromDate").value = "";

    if (!e.target.value) return;
    const [y, m] = e.target.value.split("-").map(Number);
    const from = new Date(y, m - 1, 1);
    const to = new Date(y, m, 0);
    document.getElementById("tb_fromDate").value = from.toISOString().slice(0, 10);
    document.getElementById("tb_toDate").value = to.toISOString().slice(0, 10);
    TANK_FROM_DATE = from.toISOString().slice(0, 10);
    TANK_TO_DATE = to.toISOString().slice(0, 10);
    renderTankBuyers(document.getElementById("tankBuyersSearchInput").value);
  });

  document.getElementById("payCancelBtn").addEventListener("click", closePayModal);
  document.getElementById("pay_cash").addEventListener("input", updatePaySummary);
  document.getElementById("pay_transfer").addEventListener("input", updatePaySummary);
  document.getElementById("paySaveBtn").addEventListener("click", submitPayment);

  /* --- Chăm sóc khách --- */
  try { const c = localStorage.getItem("careCycle"); if (c) CARE_CYCLE = Number(c) || 30; } catch (e) {}
  document.getElementById("careCycleSelect").value = String(CARE_CYCLE);
  document.getElementById("careCycleSelect").addEventListener("change", (e) => {
    CARE_CYCLE = Number(e.target.value) || 30;
    try { localStorage.setItem("careCycle", String(CARE_CYCLE)); } catch (err) {}
    buildCareRows(); renderCare();

  document.getElementById("careSearchInput").addEventListener("input", renderCare);
  document.querySelectorAll("#careChips .sort-chip").forEach(el => {
    el.addEventListener("click", () => {
      document.querySelectorAll("#careChips .sort-chip").forEach(x => x.classList.remove("active"));
      el.classList.add("active");
      CARE_FILTER = el.dataset.carefilter;
      renderCare();
    });
  });
  if (CURRENT_PROFILE.role === "owner") {
    const eb = document.getElementById("careEditTplBtn");
    eb.style.display = "inline-block";
    eb.addEventListener("click", openCareTemplates);
  }
  document.getElementById("careTplClose").addEventListener("click", () => document.getElementById("careTplModal").classList.remove("open"));
})();

function switchMainTab(tab) {
  document.querySelectorAll(".tabs-row .tab-btn").forEach(el => el.classList.toggle("active", el.dataset.tab === tab));
  document.getElementById("customersTab").style.display = tab === "customers" ? "block" : "none";
  document.getElementById("debtTab").style.display = tab === "debt" ? "block" : "none";
  document.getElementById("tankBuyersTab").style.display = tab === "tankBuyers" ? "block" : "none";
  document.getElementById("careTab").style.display = tab === "care" ? "block" : "none";
  if (tab === "tankBuyers" && !TANK_BUYERS_LOADED) loadTankBuyers();
  if (tab === "care") loadCare();
}

function setFormType(t) {
  FORM_TYPE = t;
  document.getElementById("typeRetailBtn").classList.toggle("active", t === "retail");
  document.getElementById("typeWholesaleBtn").classList.toggle("active", t === "wholesale");
}

/* ================= TAB: KHÁCH HÀNG ================= */
async function loadCustomers() {
  const { data, error } = await sb.from("customers").select("*").order("name");
  if (error) { console.error(error); return; }
  ALL_CUSTOMERS = data || [];

  const { data: orders } = await sb
    .from("orders")
    .select("customer_id, total_amount, created_at")
    .eq("status", "completed")
    .not("customer_id", "is", null);

  CUSTOMER_STATS = {};
  (orders || []).forEach(o => {
    if (!CUSTOMER_STATS[o.customer_id]) {
      CUSTOMER_STATS[o.customer_id] = { orderCount: 0, totalSpent: 0, lastOrderDate: null };
    }
    const s = CUSTOMER_STATS[o.customer_id];
    s.orderCount += 1;
    s.totalSpent += Number(o.total_amount);
    if (!s.lastOrderDate || new Date(o.created_at) > new Date(s.lastOrderDate)) {
      s.lastOrderDate = o.created_at;
    }
  });

  renderTable(document.getElementById("searchInput")?.value || "");
  updateDupButton();
}

/* ---------- Gộp khách trùng SĐT (chỉ chủ cửa hàng) ---------- */
function findDupGroups() {
  const groups = {};
  ALL_CUSTOMERS.forEach(c => {
    let key = normalizePhone(c.phone).replace(/^\+?84/, "0");
    if (key.length < 8) return;
    (groups[key] = groups[key] || []).push(c);
  });
  return Object.entries(groups).filter(([, arr]) => arr.length > 1).map(([phone, arr]) => {
    const sorted = [...arr].sort((a, b) => {
      const d = (CUSTOMER_STATS[b.id]?.orderCount || 0) - (CUSTOMER_STATS[a.id]?.orderCount || 0);
      return d !== 0 ? d : new Date(a.created_at) - new Date(b.created_at);
    });
    return { phone, list: sorted };
  });
}

function updateDupButton() {
  const btn = document.getElementById("dupBtn");
  if (!btn || CURRENT_PROFILE?.role !== "owner") return;
  const n = findDupGroups().length;
  btn.style.display = n > 0 ? "" : "none";
  document.getElementById("dupCount").textContent = n > 0 ? `(${n})` : "";
}

function openDupModal() {
  const body = document.getElementById("dupBody");
  const groups = findDupGroups();
  if (groups.length === 0) {
    body.innerHTML = `<div class="empty-state"><div class="icon">✅</div>Không còn khách nào trùng số điện thoại.</div>`;
    document.getElementById("dupModal").classList.add("open");
    return;
  }
  body.innerHTML = `

async function runMerge(group, keepId) {
  const dropIds = group.list.map(c => c.id).filter(id => id !== keepId);
  const { error } = await sb.rpc("merge_customers", { keep_id: keepId, drop_ids: dropIds });
  if (error) throw error;
}

async function mergeDupGroup(gi) {
  const g = findDupGroups()[gi];
  if (!g) return;
  const keepId = document.querySelector(`input[name="dupkeep_${gi}"]:checked`)?.value;
  if (!keepId) return;
  const keep = g.list.find(c => c.id === keepId);
  if (!window.confirm(`Gộp ${g.list.length} khách trùng SĐT ${g.phone} vào "${keep.name}"?\n\nKhông thể hoàn tác.`)) return;
  try { await runMerge(g, keepId); }
  catch (e) { alert("Lỗi khi gộp: " + (e.message || e) + "\n(Nếu chưa chạy migration-26.sql trong Supabase SQL Editor thì chạy trước.)"); return; }
  await loadCustomers();
  openDupModal();
}

async function mergeAllDupGroups() {
  const groups = findDupGroups();
  if (!window.confirm(`Gộp tự động ${groups.length} nhóm khách trùng SĐT?\nMỗi nhóm giữ bản có nhiều đơn nhất.\n\nKhông thể hoàn tác.`)) return;
  try { for (const g of groups) await runMerge(g, g.list[0].id); }
  catch (e) { alert("Lỗi khi gộp: " + (e.message || e) + "\n(Nếu chưa chạy migration-26.sql thì chạy trước.)"); await loadCustomers(); return; }
  await loadCustomers();
  openDupModal();
}

  if (SORT_MODE === "spend") {
    list = [...list].sort((a, b) => statsOf(b.id).totalSpent - statsOf(a.id).totalSpent);
  } else if (SORT_MODE === "recent") {
    list = [...list].sort((a, b) => {
      const da = statsOf(a.id).lastOrderDate, db = statsOf(b.id).lastOrderDate;
      if (!da && !db) return 0;

      return new Date(db) - new Date(da);

    wrap.innerHTML = `<div class="empty-state"><div class="icon">👤</div>

async function loadTankBuyers() {
  const wrap = document.getElementById("tankBuyersWrap");
  wrap.innerHTML = `<div class="empty-state"><div class="icon">⏳</div>Đang tải...</div>`;

  // Chỉ lấy đúng sản phẩm BỂ (danh mục "Bể cá"), không lấy layout/chân tủ/dịch vụ setup...
  const { data: tankProducts } = await sb.from("products").select("id, name, category").ilike("category", "%bể cá%").or("name.ilike.%promax%,name.ilike.%infinity%");
  const productIds = (tankProducts || []).map(p => p.id);
  if (productIds.length === 0) {
    wrap.innerHTML = `<div class="empty-state"><div class="icon">🐠</div>Chưa tìm thấy sản phẩm bể nào có tên chứa "ProMax" hoặc "Infinity".</div>`;
    TANK_BUYERS_LOADED = true;
    return;
  }
  const productIdToName = {};
  tankProducts.forEach(p => { productIdToName[p.id] = p.name; });

  const { data: items, error } = await sb
    .from("order_items")
    .select("product_id, orders(id, order_code, created_at, status, customers(name, phone, address))")
    .in("product_id", productIds);

  if (error) { wrap.innerHTML = `<div class="empty-state">Lỗi: ${error.message}</div>`; return; }

  ALL_TANK_BUYERS = (items || [])
    .filter(i => i.orders && i.orders.status === "completed")
    .map(i => {
      const name = productIdToName[i.product_id] || "";

        group: name.toLowerCase().includes("promax") ? "promax" : "infinity",
        tankName: name,
        customerName: i.orders.customers?.name || "Khách lẻ",
        phone: i.orders.customers?.phone || "",
        address: i.orders.customers?.address || "",
        orderId: i.orders.id,
        orderCode: i.orders.order_code,
        date: i.orders.created_at,
      };
    })
    .sort((a, b) => new Date(b.date) - new Date(a.date));

  buildTankMonthPicker();
  renderTankBuyers("");
}

function buildTankMonthPicker() {
  const sel = document.getElementById("tb_monthPicker");
  if (!sel) return;
  const now = new Date();
  let options = `<option value="">— Chọn nhanh theo tháng —</option>`;
  for (let i = 0; i < 12; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const val = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    const label = i === 0 ? `Tháng này (${d.getMonth() + 1}/${d.getFullYear()})` : `Tháng ${d.getMonth() + 1}/${d.getFullYear()}`;
    options += `<option value="${val}">${label}</option>`;
  }
  sel.innerHTML = options;
}

async function loadDebts() {
  const { data: customers } = await sb.from("customers").select("*");
  const { data: orders } = await sb.from("orders")
    .select("id, order_code, type, total_amount, paid_amount, created_at, customer_id")
    .eq("status", "completed")
    .not("customer_id", "is", null)
    .order("created_at", { ascending: true });

  const byCustomer = {};
  (orders || []).forEach(o => {
    const debt = Number(o.total_amount) - Number(o.paid_amount);
    if (debt <= 0) return;
    if (!byCustomer[o.customer_id]) byCustomer[o.customer_id] = [];
    byCustomer[o.customer_id].push({ ...o, debt });
  });

  DEBT_LIST = Object.keys(byCustomer).map(custId => {
    const customer = (customers || []).find(c => c.id === custId);
    const ordersForCustomer = byCustomer[custId];
    const totalDebt = ordersForCustomer.reduce((s, o) => s + o.debt, 0);
    return { customer, orders: ordersForCustomer, totalDebt };
  }).filter(x => x.customer).sort((a, b) => b.totalDebt - a.totalDebt);

  renderDebtStats();
  renderDebtList("");
}

function openPayModal(customerId) {
  PAY_CUSTOMER = DEBT_LIST.find(x => x.customer.id === customerId);
  if (!PAY_CUSTOMER) return;
  document.getElementById("payModalTitle").textContent = "Ghi nhận thanh toán — " + PAY_CUSTOMER.customer.name;
  document.getElementById("payCurrentDebt").textContent = formatVND(PAY_CUSTOMER.totalDebt);
  document.getElementById("pay_cash").value = 0;
  document.getElementById("pay_transfer").value = 0;
  document.getElementById("pay_note").value = "";
  updatePaySummary();
  document.getElementById("payModal").classList.add("open");
}
function closePayModal() { document.getElementById("payModal").classList.remove("open"); }

function updatePaySummary() {
  if (!PAY_CUSTOMER) return;
  const cash = Number(document.getElementById("pay_cash").value || 0);
  const transfer = Number(document.getElementById("pay_transfer").value || 0);
  const remaining = Math.max(PAY_CUSTOMER.totalDebt - cash - transfer, 0);
  document.getElementById("payRemaining").textContent = formatVND(remaining);
}

async function submitPayment() {
  if (!PAY_CUSTOMER) return;
  const cash = Number(document.getElementById("pay_cash").value || 0);
  const transfer = Number(document.getElementById("pay_transfer").value || 0);
  let remaining = cash + transfer;

  if (remaining <= 0) { alert("Vui lòng nhập số tiền thanh toán."); return; }

  const saveBtn = document.getElementById("paySaveBtn");
  saveBtn.disabled = true;
  saveBtn.textContent = "Đang lưu...";

  const note = document.getElementById("pay_note").value.trim();

  let cashLeft = cash, transferLeft = transfer;
  for (const o of PAY_CUSTOMER.orders) {
    if (remaining <= 0) break;
    const applyToOrder = Math.min(o.debt, remaining);
    if (applyToOrder <= 0) continue;

    const newPaid = Number(o.paid_amount) + applyToOrder;
    await sb.from("orders").update({ paid_amount: newPaid }).eq("id", o.id);

    let applyCash = Math.min(cashLeft, applyToOrder);
    let applyTransfer = applyToOrder - applyCash;
    cashLeft -= applyCash;
    transferLeft -= applyTransfer;

    if (applyCash > 0) {
      await sb.from("customer_payments").insert({
        customer_id: PAY_CUSTOMER.customer.id, order_id: o.id, amount: applyCash,
        method: "cash", note: note || null, created_by: CURRENT_PROFILE.id
      });
    }
    if (applyTransfer > 0) {
      await sb.from("customer_payments").insert({
        customer_id: PAY_CUSTOMER.customer.id, order_id: o.id, amount: applyTransfer,
        method: "transfer", note: note || null, created_by: CURRENT_PROFILE.id
      });
    }

    remaining -= applyToOrder;
  }

  const totalCashCollected = cash - cashLeft;
  const totalTransferCollected = transfer - transferLeft;
  if (totalCashCollected > 0) {
    await sb.from("cash_transactions").insert({
      type: "income", method: "cash", category: "Thu nợ khách", amount: totalCashCollected,
      note: `Thu nợ tiền mặt từ ${PAY_CUSTOMER.customer.name}`, created_by: CURRENT_PROFILE.id
    });
  }
  if (totalTransferCollected > 0) {
    await sb.from("cash_transactions").insert({
      type: "income", method: "transfer", category: "Thu nợ khách", amount: totalTransferCollected,
      note: `Thu nợ chuyển khoản từ ${PAY_CUSTOMER.customer.name}`, created_by: CURRENT_PROFILE.id
    });
  }

  saveBtn.disabled = false;
  saveBtn.textContent = "Ghi nhận";
  closePayModal();
  await loadDebts();
  alert("Đã ghi nhận thanh toán thành công!");
}

    .from("orders")
    .select("id, order_code, type, total_amount, paid_amount, discount_amount, created_at, customer_id, customers(name, phone, address)")
    .eq("id", orderId)
    .single();

  const { data: items } = await sb
    .from("order_items")
    .select("id, product_id, quantity, unit_price, cost_price_at_sale, subtotal, list_price, discount_percent, products(name, unit)")
    .eq("order_id", orderId);

  const { data: payments } = await sb
    .from("customer_payments")
    .select("amount, method")
    .eq("order_id", orderId);

  if (orderErr || !order) { body.innerHTML = `<div class="empty-state">Không tải được đơn hàng.</div>`; return; }

  CURRENT_DEBT_ORDER = { ...order, items: items || [], payments: payments || [] };
  document.getElementById("orderDetailTitle").textContent = order.order_code;
  renderOrderDetailBody();
}

function recalcItemRow(idx) {
  const order = CURRENT_DEBT_ORDER;
  if (!order) return;
  const input = document.querySelector(`.ed-item-price[data-idx="${idx}"]`);
  const price = Number(input.value || 0);
  const qty = Number(order.items[idx].quantity);
  const cell = document.getElementById(`ip_subtotal_${idx}`);
  if (cell) cell.textContent = formatVND(price * qty);
  updateEditTotalFromItems();
}

function updateEditTotalFromItems() {
  const order = CURRENT_DEBT_ORDER;
  if (!order) return;
  let subtotalSum = 0;
  document.querySelectorAll(".ed-item-price").forEach(inp => {
    const idx = Number(inp.dataset.idx);
    subtotalSum += Number(inp.value || 0) * Number(order.items[idx].quantity);
  });
  const discount = Number(document.getElementById("ed_discount")?.value || 0);
  const totalInput = document.getElementById("ed_total");
  if (totalInput) totalInput.value = Math.max(subtotalSum - discount, 0);
}

async function saveOrderEdits() {
  const order = CURRENT_DEBT_ORDER;
  if (!order) return;

  const priceInputs = document.querySelectorAll(".ed-item-price");
  const newItemValues = [];
  for (const inp of priceInputs) {
    const price = Number(inp.value || 0);
    if (price < 0) { alert("Đơn giá không hợp lệ."); return; }
    newItemValues.push({ idx: Number(inp.dataset.idx), price });
  }

  const newDiscount = Number(document.getElementById("ed_discount").value || 0);
  const newTotal = Number(document.getElementById("ed_total").value || 0);

  if (newTotal < 0 || newDiscount < 0) { alert("Giá trị không hợp lệ."); return; }
  if (newTotal < Number(order.paid_amount)) {
    if (!confirm(`Tổng tiền mới (${formatVND(newTotal)}) thấp hơn số khách đã trả (${formatVND(order.paid_amount)}) cho đơn này. Vẫn lưu?`)) return;
  }

  // Lưu đơn giá từng dòng sản phẩm đã sửa
  for (const { idx, price } of newItemValues) {
    const item = order.items[idx];
    const newSubtotal = price * Number(item.quantity);
    if (price !== Number(item.unit_price) || newSubtotal !== Number(item.subtotal)) {
      const upd = { unit_price: price };
      if (Number(item.list_price) > 0) {
        const pct = price < Number(item.list_price) ? Math.round(((Number(item.list_price) - price) / Number(item.list_price)) * 10000) / 100 : 0;
        upd.discount_percent = pct; if (pct === 0) upd.list_price = null;
        item.discount_percent = pct; if (pct === 0) item.list_price = null;
      }
      const { error: itemErr } = await sb.from("order_items").update(upd).eq("id", item.id);
      if (itemErr) { alert("Lỗi khi lưu đơn giá: " + itemErr.message); return; }
      item.unit_price = price;
      item.subtotal = newSubtotal;
    }
  }

  // Giá vốn chốt riêng của từng dòng trong đơn (chỉ chủ cửa hàng)
  if (CURRENT_PROFILE?.role === "owner") {
    for (const inp of document.querySelectorAll(".ed-item-cost")) {
      const cost = Number(inp.value || 0);
      const item = order.items[Number(inp.dataset.idx)];
      if (!item || cost < 0 || cost === Number(item.cost_price_at_sale || 0)) continue;
      const { error: costErr } = await sb.from("order_items").update({ cost_price_at_sale: cost }).eq("id", item.id);
      if (costErr) { alert("Lỗi khi lưu giá vốn: " + costErr.message); return; }
      item.cost_price_at_sale = cost;
    }
  }

  const { error } = await sb.from("orders").update({ discount_amount: newDiscount, total_amount: newTotal }).eq("id", order.id);
  if (error) { alert("Lỗi khi lưu: " + error.message); return; }

  order.discount_amount = newDiscount;
  order.total_amount = newTotal;
  EDIT_ORDER_MODE = false;
  renderOrderDetailBody();
  await loadDebts();
}

async function payThisOrder() {
  const order = CURRENT_DEBT_ORDER;
  if (!order || !order.customer_id) return;
  const debt = Number(order.total_amount) - Number(order.paid_amount);
  const cash = Number(document.getElementById("od_pay_cash").value || 0);
  const transfer = Number(document.getElementById("od_pay_transfer").value || 0);
  const total = cash + transfer;

  if (total <= 0) { alert("Vui lòng nhập số tiền thanh toán."); return; }
  if (total > debt) {
    if (!confirm(`Số tiền nhập (${formatVND(total)}) lớn hơn nợ còn lại (${formatVND(debt)}) của đơn này. Vẫn ghi nhận?`)) return;
  }

  const btn = document.getElementById("odPaySaveBtn");
  btn.disabled = true; btn.textContent = "Đang lưu...";

  const newPaid = Number(order.paid_amount) + total;
  const { error } = await sb.from("orders").update({ paid_amount: newPaid }).eq("id", order.id);
  if (error) { alert("Lỗi khi lưu: " + error.message); btn.disabled = false; btn.textContent = "✓ Xác nhận thanh toán"; return; }

  if (cash > 0) {
    await sb.from("customer_payments").insert({
      customer_id: order.customer_id, order_id: order.id, amount: cash,
      method: "cash", note: `Thanh toán đơn ${order.order_code}`, created_by: CURRENT_PROFILE.id
    });
    await sb.from("cash_transactions").insert({
      type: "income", method: "cash", category: "Thu nợ khách", amount: cash,
      note: `Thu nợ đơn ${order.order_code}`, created_by: CURRENT_PROFILE.id
    });
  }
  if (transfer > 0) {
    await sb.from("customer_payments").insert({
      customer_id: order.customer_id, order_id: order.id, amount: transfer,
      method: "transfer", note: `Thanh toán đơn ${order.order_code}`, created_by: CURRENT_PROFILE.id
    });
    await sb.from("cash_transactions").insert({
      type: "income", method: "transfer", category: "Thu nợ khách", amount: transfer,
      note: `Thu nợ đơn ${order.order_code}`, created_by: CURRENT_PROFILE.id
    });
  }

  document.getElementById("orderDetailModal").classList.remove("open");
  await loadDebts();
  alert("Đã ghi nhận thanh toán cho đơn " + order.order_code);
}

const CARE_DEFAULT_TPL = {

  followup: { name: "Hỏi thăm định kỳ / lâu chưa mua lại", content: "Dạ {xung_ho} ơi, em bên 2D Aquatic ạ. Lâu rồi em chưa thấy {xung_ho} ghé ({so_ngay} ngày kể từ lần mua {san_pham}). Bể nhà mình dạo này thế nào ạ? Cần bổ sung vật tư gì {xung_ho} nhắn em chuẩn bị sẵn nhé!" }
};
let CARE_TPL_LIST = [];      // [{code, name, content, builtin}]
let CARE_TPL_EDIT = [];      // bản đang chỉnh trong cửa sổ sửa mẫu
let CARE_TPL_DELETED = [];

async function careFetchAll(buildQuery) {
  const out = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await buildQuery().range(from, from + 999);
    if (error) throw error;
    out.push(...(data || []));
    if (!data || data.length < 1000) break;
  }
  return out;
}

function careTplByCode(code) { return CARE_TPL_LIST.find(t => t.code === code) || { code, name: code, content: "" }; }

async function loadCare() {
  const wrap = document.getElementById("careListWrap");
  wrap.innerHTML = `<div class="empty-state"><div class="icon">⏳</div>Đang tải...</div>`;
  try {
    const orders = await careFetchAll(() => sb.from("orders")
      .select("id, order_code, created_at, total_amount, paid_amount, customer_id, order_items(products(name, category))")

    const { data: tpls, error: tplErr } = await sb.from("care_templates").select("code, name, content, updated_at").order("updated_at");

    })).concat((tpls || []).filter(t => !CARE_DEFAULT_TPL[t.code]).map(t => ({ code: t.code, builtin: false, name: t.name, content: t.content })));

    CARE_TANKS = {};
    (tanks || []).forEach(t => { (CARE_TANKS[t.customer_id] = CARE_TANKS[t.customer_id] || []).push(t.name); });
    CARE_DATA = { orders, contacts };
  } catch (err) {
    console.error(err);
    wrap.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div>Không tải được dữ liệu chăm sóc khách.<br>
      <span style="font-size:12.5px;">Nếu chưa chạy <b>migration-24.sql</b> trong Supabase SQL Editor thì chạy trước. (${err.message || err})</span></div>`;
    return;
  }

}

function careDaysAgo(d) { return Math.floor((Date.now() - new Date(d).getTime()) / 86400000); }
function careShortDate(d) { return formatDate(d); }
function careEsc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;"); }

function careXungHo(name) {
  const first = String(name || "").split(" - ")[0].trim();
  if (/^(anh|chị|chi|cô|co|chú|chu|bạn|ban|em)\s/i.test(first)) return first.charAt(0).toLowerCase() + first.slice(1);
  return "anh/chị";
}

function careFill(tpl, vars) {
  return tpl.replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined ? vars[k] : m));
}

function careListNames(names, max) {
  if (names.length === 0) return "";
  if (names.length <= max) return names.join(", ");
  return names.slice(0, max).join(", ") + " và " + (names.length - max) + " sản phẩm khác";
}

function buildCareRows() {
  const byCust = {};
  CARE_DATA.orders.forEach(o => { (byCust[o.customer_id] = byCust[o.customer_id] || { orders: [], contacts: [] }).orders.push(o); });
  CARE_DATA.contacts.forEach(c => { if (byCust[c.customer_id]) byCust[c.customer_id].contacts.push(c); });

  CARE_ROWS = [];
  ALL_CUSTOMERS.forEach(c => {
    const d = byCust[c.id];
    if (!d || !c.phone || !normalizePhone(c.phone)) return;
    const last = d.orders[0]; // đã sắp xếp mới nhất trước
    const lastPurchase = new Date(last.created_at);
    const lastContact = d.contacts.length ? new Date(d.contacts[0].contacted_at) : null;
    const daysSincePurchase = careDaysAgo(lastPurchase);
    const daysSinceContact = lastContact ? careDaysAgo(lastContact) : null;
    const touch = lastContact && lastContact > lastPurchase ? lastContact : lastPurchase;
    const daysSinceTouch = careDaysAgo(touch);

    const lastNames = [...new Set((last.order_items || []).map(i => i.products?.name).filter(Boolean))];
    const productText = lastNames.length === 0 ? "đơn hàng" : (lastNames.length <= 2 ? lastNames.join(" và ") : careListNames(lastNames, 2));

    // Thống kê toàn bộ lịch sử: số đơn, tổng chi tiêu, sản phẩm hay mua, bể đã mua
    const freq = {}; const tankBought = new Set();
    let totalSpent = 0;
    d.orders.forEach(o => {
      totalSpent += Number(o.total_amount);
      (o.order_items || []).forEach(i => {
        const n = i.products?.name; if (!n) return;
        freq[n] = (freq[n] || 0) + 1;
        if (/bể/i.test(i.products?.category || "")) tankBought.add(n);
      });
    });
    const topProducts = Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([n, k]) => (k > 1 ? `${n} (${k} lần)` : n));
    const tankInfo = (c.tank_info || "").trim();
    const tanks = [...new Set([...(CARE_TANKS[c.id] || []), ...tankBought])];

    const debtOrders = d.orders.filter(o => Number(o.total_amount) - Number(o.paid_amount) > 0);
    const totalDebt = debtOrders.reduce((s, o) => s + Number(o.total_amount) - Number(o.paid_amount), 0);
    const oldestDebt = debtOrders.length ? debtOrders[debtOrders.length - 1] : null;
    const oldestDebtDays = oldestDebt ? careDaysAgo(oldestDebt.created_at) : 0;

    let reason = null, code = "followup", priority = 9;
    if (oldestDebt && oldestDebtDays >= 7 && (daysSinceContact === null || daysSinceContact >= 7)) {
      reason = `Còn nợ ${formatVND(totalDebt)} (đơn ${oldestDebt.order_code}, ${oldestDebtDays} ngày)`; code = "debt"; priority = 1;
    } else if (daysSincePurchase >= 1 && daysSincePurchase <= 3 && (!lastContact || lastContact < lastPurchase)) {
      reason = `Mới mua ${daysSincePurchase} ngày trước, hỏi thăm`; code = "new_purchase"; priority = 2;
    } else if (daysSinceTouch >= CARE_CYCLE) {
      reason = lastContact && lastContact > lastPurchase
        ? `Đã ${daysSinceContact} ngày chưa nhắn lại`
        : `Đã ${daysSincePurchase} ngày chưa mua lại, chưa nhắn`;
      code = "followup"; priority = 3;
    }
    if (!reason) code = (totalDebt > 0 && oldestDebtDays >= 7) ? "debt" : (daysSincePurchase <= 3 ? "new_purchase" : "followup");

    const vars = {
      xung_ho: careXungHo(c.name), san_pham: productText, ngay_mua: careShortDate(lastPurchase),
      so_ngay: String(daysSincePurchase), ma_don: oldestDebt ? oldestDebt.order_code : last.order_code,
      so_tien_no: formatVND(totalDebt), be: [tankInfo, ...tanks].filter(Boolean).join("; ")
    };

    CARE_ROWS.push({
      customer: c, phone: c.phone, due: !!reason, reason, code, priority,
      lastPurchase, daysSincePurchase, lastNames, orderCount: d.orders.length, totalSpent, topProducts, tanks, tankInfo,
      lastContact, daysSinceContact, contactCount: d.contacts.length,
      lastContactId: d.contacts.length ? d.contacts[0].id : null,
      daysSinceTouch, vars
    });
  });
  CARE_ROWS.sort((a, b) => (a.due === b.due ? (a.priority - b.priority || b.daysSinceTouch - a.daysSinceTouch) : (a.due ? -1 : 1)));
}

function renderCare() {
  const wrap = document.getElementById("careListWrap");
  const f = (document.getElementById("careSearchInput").value || "").trim().toLowerCase();
  let rows = CARE_ROWS.filter(r => phoneOrNameMatches(r.customer.name, r.phone, f));
  const dueCount = CARE_ROWS.filter(r => r.due).length;
  if (CARE_FILTER === "due") rows = rows.filter(r => r.due);
  else if (CARE_FILTER === "recent") rows = rows.filter(r => r.daysSinceContact !== null && r.daysSinceContact <= 7)
    .sort((a, b) => b.lastContact - a.lastContact);

  const noPhone = ALL_CUSTOMERS.filter(c => !c.phone || !normalizePhone(c.phone)).length;
  document.getElementById("careSummary").textContent =
    `${dueCount} khách cần nhắn (chu kỳ ${CARE_CYCLE} ngày) · Tổng ${CARE_ROWS.length} khách có SĐT và lịch sử mua` + (noPhone ? ` · ${noPhone} khách chưa có SĐT nên không hiện ở đây` : "");

  if (rows.length === 0) {
    wrap.innerHTML = `<div class="empty-state"><div class="icon">${CARE_FILTER === "due" ? "✅" : "🔍"}</div>${CARE_FILTER === "due" ? "Hôm nay không có khách nào cần nhắn." : "Không có khách phù hợp."}</div>`;
    return;
  }

  wrap.innerHTML = `<div class="panel"><div class="panel-body" style="overflow-x:auto;"><table>
    <thead><tr><th>Khách hàng</th><th>Bể của khách</th><th>Lịch sử mua</th><th>Lần nhắn cuối</th><th>Lý do</th><th>Nhắn tin</th></tr></thead>
    <tbody>${rows.map(r => {
      const sel = CARE_SELECTED_TPL[r.customer.id] || r.code;
      return `<tr>
      <td style="min-width:150px;"><strong style="cursor:pointer; color:var(--teal-deep); text-decoration:underline;" title="Xem lịch sử mua hàng" onclick="openOrdersHistory('${r.customer.id}')">${careEsc(r.customer.name)}</strong>
        <div class="text-mute" style="font-size:12px;">${careEsc(r.phone)}</div></td>
      <td style="min-width:150px; max-width:220px; font-size:12.5px;">
        ${r.tankInfo ? `<div style="white-space:pre-wrap;">📝 ${careEsc(r.tankInfo)}</div>` : ""}
        ${r.tanks.map(t => `<div>🪸 ${careEsc(t)}</div>`).join("")}
        ${!r.tankInfo && !r.tanks.length ? `<span class="text-mute">—</span><br>` : ""}
        <span style="cursor:pointer; color:var(--teal-deep);" onclick="openModal('${r.customer.id}'); setTimeout(()=>document.getElementById('f_tank_info').focus(),50)">${r.tankInfo ? "✎ Sửa" : "+ Thêm thông tin bể"}</span>
      </td>
      <td style="min-width:260px; font-size:12.5px;">
        <div><strong>${r.orderCount} đơn</strong> · tổng ${formatVND(r.totalSpent)}</div>
        <div class="text-mute">Gần nhất ${careShortDate(r.lastPurchase)} (${r.daysSincePurchase} ngày trước): ${careEsc(careListNames(r.lastNames, 5))}</div>
        ${r.topProducts.length ? `<div class="text-mute">Hay mua: ${careEsc(r.topProducts.join(", "))}</div>` : ""}
        <span style="cursor:pointer; color:var(--teal-deep);" onclick="openOrdersHistory('${r.customer.id}')">Xem tất cả đơn →</span>
      </td>
      <td style="min-width:120px; font-size:12.5px;">${r.lastContact
        ? `${careShortDate(r.lastContact)}<div class="text-mute">${r.daysSinceContact} ngày trước · ${r.contactCount} lần
            <span style="cursor:pointer; color:var(--danger);" title="Bấm nhầm? Bỏ ghi nhận lần nhắn cuối" onclick="undoCareContact('${r.customer.id}')">↩ bỏ</span></div>`
        : `<span class="text-mute">Chưa nhắn lần nào</span>`}</td>
      <td style="min-width:150px; font-size:12.5px;">${r.reason ? `<span style="color:${r.code === "debt" ? "var(--danger)" : "var(--teal-deep)"}; font-weight:600;">${careEsc(r.reason)}</span>` : `<span class="text-mute">Chưa đến hạn</span>`}</td>
      <td style="min-width:170px;">
        <select style="font-size:12px; padding:4px; margin-bottom:6px; width:100%;" onchange="CARE_SELECTED_TPL['${r.customer.id}']=this.value">
          ${CARE_TPL_LIST.map(t => `<option value="${t.code}" ${t.code === sel ? "selected" : ""}>${careEsc(t.name)}</option>`).join("")}
        </select>
        <button class="btn btn-primary btn-mini" onclick="sendCare('${r.customer.id}')">💬 Nhắn Zalo</button>
      </td>
    </tr>`; }).join("")}</tbody></table></div></div>`;
}

function careZaloUrl(phone) {
  let d = normalizePhone(phone).replace(/^\+/, "");
  if (d.startsWith("84") && d.length >= 11) d = "0" + d.slice(2);
  return "https://zalo.me/" + d;
}

function careCopySync(text) {
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  ta.remove();
  try { navigator.clipboard && navigator.clipboard.writeText(text); } catch (e) {}
  return ok;
}

function careToast(msg) {
  let t = document.getElementById("careToast");
  if (!t) {
    t = document.createElement("div"); t.id = "careToast";
    t.style.cssText = "position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:#0f1b2d; color:#fff; padding:12px 18px; border-radius:10px; font-size:13.5px; z-index:300; max-width:90vw; box-shadow:0 6px 20px rgba(0,0,0,.25);";
    document.body.appendChild(t);
  }
  t.textContent = msg; t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => { t.style.display = "none"; }, 5000);
}

async function sendCare(customerId) {
  const r = CARE_ROWS.find(x => x.customer.id === customerId);
  if (!r) return;
  const code = CARE_SELECTED_TPL[customerId] || r.code;
  const message = careFill(careTplByCode(code).content, r.vars);

  // Phải copy + mở Zalo ngay trong lúc bấm chuột (trước mọi thao tác chờ mạng) để trình duyệt không chặn
  const copied = careCopySync(message);
  window.open(careZaloUrl(r.phone), "_blank");

  const { data, error } = await sb.from("customer_contacts")
    .insert({ customer_id: customerId, template_code: code, message, created_by: CURRENT_PROFILE.id })
    .select("id, customer_id, contacted_at").single();
  if (error) { alert("Đã mở Zalo nhưng chưa ghi nhận được lần nhắn: " + error.message); return; }

  CARE_DATA.contacts.unshift(data);
  buildCareRows(); renderCare();
  careToast(copied
    ? `✅ Đã copy tin nhắn, dán vào Zalo của ${r.customer.name}. Đã ghi nhận đã nhắn.`
    : `Đã mở Zalo và ghi nhận đã nhắn ${r.customer.name}. Chưa copy được tin, hãy vào "Sửa mẫu tin nhắn" để copy nội dung.`);
}

async function undoCareContact(customerId) {
  const r = CARE_ROWS.find(x => x.customer.id === customerId);
  if (!r || !r.lastContactId) return;
  if (!confirm(`Bỏ ghi nhận lần nhắn cuối cho ${r.customer.name}?`)) return;
  const { error } = await sb.from("customer_contacts").delete().eq("id", r.lastContactId);
  if (error) { alert("Lỗi: " + error.message); return; }
  CARE_DATA.contacts = CARE_DATA.contacts.filter(c => c.id !== r.lastContactId);
  buildCareRows(); renderCare();
}

/* ---------- Sửa / thêm / copy mẫu tin nhắn ---------- */
function openCareTemplates() {
  CARE_TPL_EDIT = CARE_TPL_LIST.map(t => ({ ...t }));
  CARE_TPL_DELETED = [];
  renderCareTplEditor();
  document.getElementById("careTplModal").classList.add("open");
}

function syncCareTplFromDom() {
  CARE_TPL_EDIT.forEach((t, i) => {
    const n = document.getElementById("tplName_" + i), c = document.getElementById("tplContent_" + i);
    if (n) t.name = n.value; if (c) t.content = c.value;
  });
}

function renderCareTplEditor() {
  const body = document.getElementById("careTplBody");
  body.innerHTML = `
    <div class="text-mute" style="font-size:12.5px; margin-bottom:12px;">
      Chỗ trống tự thay theo từng khách: <b>{xung_ho}</b> (anh Đức...), <b>{san_pham}</b> (sản phẩm đơn gần nhất), <b>{ngay_mua}</b>, <b>{so_ngay}</b> (số ngày kể từ lần mua cuối), <b>{be}</b> (bể của khách), <b>{ma_don}</b> và <b>{so_tien_no}</b> (dùng cho tin nhắc nợ).
    </div>
    ${CARE_TPL_EDIT.map((t, i) => `
      <div style="border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:12px;">
        <div class="flex gap-8" style="align-items:center; margin-bottom:8px;">
          <input id="tplName_${i}" value="${careEsc(t.name)}" placeholder="Tên mẫu" style="flex:1; font-weight:600;">
          <span class="btn btn-secondary btn-mini" onclick="copyCareTpl(${i}, this)">📋 Copy</span>
          ${t.builtin ? "" : `<span class="btn btn-secondary btn-mini" style="color:var(--danger);" onclick="deleteCareTpl(${i})">🗑 Xóa</span>`}
        </div>
        <textarea id="tplContent_${i}" rows="4" style="width:100%;">${careEsc(t.content)}</textarea>
      </div>`).join("")}
    <div class="flex gap-8" style="justify-content:space-between; margin-top:12px; flex-wrap:wrap;">
      <button type="button" class="btn btn-secondary" onclick="addCareTpl()">+ Thêm mẫu mới</button>
      <div class="flex gap-8">
        <button type="button" class="btn btn-secondary" onclick="document.getElementById('careTplModal').classList.remove('open')">Hủy</button>
        <button type="button" class="btn btn-primary" id="careTplSaveBtn" onclick="saveCareTemplates()">Lưu mẫu tin</button>
      </div>
    </div>`;
}

function addCareTpl() {
  syncCareTplFromDom();
  CARE_TPL_EDIT.push({ code: "custom_" + Date.now(), name: "Mẫu mới", content: "Dạ {xung_ho} ơi, em bên 2D Aquatic ạ. ", builtin: false, isNew: true });
  renderCareTplEditor();
  const i = CARE_TPL_EDIT.length - 1;
  const el = document.getElementById("tplName_" + i);
  if (el) { el.focus(); el.select(); }
}

function deleteCareTpl(i) {
  syncCareTplFromDom();
  const t = CARE_TPL_EDIT[i];
  if (!confirm(`Xóa mẫu "${t.name}"?`)) return;
  if (!t.isNew) CARE_TPL_DELETED.push(t.code);
  CARE_TPL_EDIT.splice(i, 1);
  renderCareTplEditor();
}

function copyCareTpl(i, btn) {
  const text = document.getElementById("tplContent_" + i).value;
  const ok = careCopySync(text);
  const old = btn.textContent;
  btn.textContent = ok ? "✓ Đã copy" : "Không copy được";
  setTimeout(() => { btn.textContent = old; }, 1500);
}

async function saveCareTemplates() {
  syncCareTplFromDom();
  if (CARE_TPL_EDIT.some(t => !t.name.trim() || !t.content.trim())) { alert("Tên và nội dung mẫu không được để trống."); return; }
  const btn = document.getElementById("careTplSaveBtn");
  btn.disabled = true; btn.textContent = "Đang lưu...";
  const now = new Date().toISOString();
  const rows = CARE_TPL_EDIT.map(t => ({ code: t.code, name: t.name.trim(), content: t.content.trim(), updated_at: now }));
  const { error } = await sb.from("care_templates").upsert(rows, { onConflict: "code" });
  let delErr = null;
  if (!error && CARE_TPL_DELETED.length) {
    ({ error: delErr } = await sb.from("care_templates").delete().in("code", CARE_TPL_DELETED));
  }
  btn.disabled = false; btn.textContent = "Lưu mẫu tin";
  if (error || delErr) { alert("Lỗi khi lưu: " + (error || delErr).message); return; }
  CARE_TPL_LIST = CARE_TPL_EDIT.map(t => ({ code: t.code, name: t.name.trim(), content: t.content.trim(), builtin: !!t.builtin }));
  CARE_SELECTED_TPL = {};
  document.getElementById("careTplModal").classList.remove("open");
  renderCare();
  careToast("Đã lưu mẫu tin nhắn.");
}
</script>
</body>
</html>
